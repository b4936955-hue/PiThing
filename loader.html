<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading The Library of Pi</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #eee; font: 15px Arial, sans-serif; }
    main { width: min(560px, calc(100% - 48px)); padding: 24px; border: 1px solid #333; border-radius: 12px; background: #111; }
    p { color: #aaa; white-space: pre-wrap; line-height: 1.5; }
    button { border: 0; border-radius: 7px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
  </style>
</head>
<body>
  <main id="loader">
    <h1>Loading The Library of Pi</h1>
    <p id="status">Connecting to GitHub…</p>
  </main>
  <script>
    (async function () {
      var USER = "b4936955-hue";
      var REPO = "PiThing";
      var branches = ["master", "main"];
      var sources = [];
      branches.forEach(function (branch) {
        sources.push("https://cdn.jsdelivr.net/gh/" + USER + "/" + REPO + "@" + branch + "/");
        sources.push("https://raw.githubusercontent.com/" + USER + "/" + REPO + "/" + branch + "/");
        sources.push("https://cdn.jsdelivr.net/gh/" + USER + "/" + REPO + "@" + branch + "/docs/");
        sources.push("https://raw.githubusercontent.com/" + USER + "/" + REPO + "/" + branch + "/docs/");
      });
      var status = document.getElementById("status");
      var failures = [];
      for (var i = 0; i < sources.length; i++) {
        status.textContent = "Fetching the site (" + (i + 1) + "/" + sources.length + ")…";
        try {
          var response = await fetch(sources[i] + "index.html?v=" + Date.now(), { cache: "no-store" });
          if (!response.ok) {
            failures.push(sources[i] + " returned HTTP " + response.status);
            continue;
          }
          var html = await response.text();
          if (html.indexOf("The Library of Pi") < 0) {
            failures.push(sources[i] + " returned unexpected content");
            continue;
          }
          var base = "<base href=\"" + sources[i] + "\">";
          html = html.replace(/<head([^>]*)>/i, function (tag) { return tag + base; });
          document.open();
          document.write(html);
          document.close();
          return;
        } catch (error) {
          failures.push(sources[i] + ": " + (error && error.message ? error.message : error));
        }
      }
      var loader = document.getElementById("loader");
      loader.innerHTML = "<h1>Loader failed</h1><p id=\"error\"></p><button onclick=\"location.reload()\">Retry</button>";
      document.getElementById("error").textContent =
        "Could not load the built site from " + USER + "/" + REPO + ". Run build.bat and push.bat first.\n" + failures.join("\n");
    })();
  </script>
</body>
</html>
